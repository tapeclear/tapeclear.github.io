<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{ min-height:100vh;display:flex;align-items:center;justify-content:center; background-color:#0f0a14; background-image: radial-gradient(circle at 50% 30%, #2d1b3d 0%, #0a0510 100%); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 15px; }
.walkman{ position:relative;width:100%;max-width:380px; height: 85vh;min-height: 650px; display: flex;flex-direction: column; border-radius:24px;padding: 16px 2px; background:linear-gradient(145deg, #2c1a3d 0%, #180b25 50%, #0e0516 100%); box-shadow: 0 25px 50px rgba(0,0,0,.8), inset 0 2px 2px rgba(255,255,255,.1), inset 0 -4px 10px rgba(0,0,0,.6); border: 1px solid rgba(180, 130, 255, 0.15); }

.screen-frame{ background:#050208; border-radius:2px; padding:3px 2px; box-shadow: inset 0 2px 6px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.1); flex: 1; display: flex; flex-direction: column; margin: 0 auto 24px; width: 94%; max-width: 320px; position:relative;z-index:2; }
.screen{ position:relative;height:100%;border-radius:1px;overflow:hidden; background: radial-gradient(circle at 70% 20%, rgba(255,255,255,0.3) 0%, transparent 40%), linear-gradient(135deg, #FF66FF 0%, #FF33CC 40%, #C700FF 100%); color:#FFFFFF; font-family: Arial, Helvetica, sans-serif; box-shadow: inset 0 0 20px rgba(0,0,0,.2); display: flex; flex-direction: column; filter: brightness(0.80) saturate(0.75); }

.music-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; font-style: italic; letter-spacing: 1px; text-shadow: 0 1px 2px rgba(0,0,0,0.1); text-align: center; width: 100%; }
.song-title-row { display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: bold; margin-bottom: 10px; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }

.dpad-up { top: 0; left: 50%; transform: translateX(-50%); }
.dpad-down { bottom: 0; left: 50%; transform: translateX(-50%); }
.dpad-left { left: 0; top: 50%; transform: translateY(-50%); }
.dpad-right { right: 0; top: 50%; transform: translateY(-50%); }
.dial-center { width: 54px; height: 54px; border-radius: 50%; border: none; background: linear-gradient(180deg, #DCDCDC 0%, #999 100%); box-shadow: 0 4px 8px rgba(0,0,0,.6), inset 0 1px 2px #fff; color: #222; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .05s; padding-left: 2px; line-height: 1; }
.dial-center.paused { padding-left: 0; letter-spacing: -2px; padding-right: 2px; }
.dial-center:active { transform: scale(0.95); box-shadow: 0 1px 2px rgba(0,0,0,.6); }
.side-btns { position: absolute; right: -5px; top: 10px; display: flex; flex-direction: column; gap: 40px;}
.side-circle { width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer; background: linear-gradient(135deg, #E6E6E6, #888); box-shadow: 0 3px 6px rgba(0,0,0,.7), inset 0 1px 1px #fff; color: #333; font-size: 8px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
.side-circle:active { transform: translateY(2px); box-shadow: none; }
.walkman-dots { position: absolute; right: 15px; bottom: 15px; width: 32px; height: 24px; display: flex; align-items: flex-end; }
.foot{display:flex; align-items:center; gap:10px; flex-shrink:0; position:relative; z-index:2; padding: 0 25px;}
.volbox{flex:1; display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.05); border-radius:6px; padding:6px 10px; box-shadow:inset 0 1px 3px rgba(0,0,0,.5); border:1px solid rgba(255,255,255,0.1);}
.volbox .vlabel{font-size:10px;color:#8E74A8; font-weight:bold;}
#volume{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:rgba(142,116,168,0.3);outline:none;}
#volume::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:18px;border-radius:2px;background:#DCDCDC;border:1px solid #999;cursor:pointer;}
</style>

<script>
(function(){
  var list = window.PLAYLIST || [];
  var audio = document.getElementById('audio');
  var $ = function(id){ return document.getElementById(id); };
  var elCover=$('cover'), elCoverPh=$('coverPh'), elTitle=$('songTitle'), elArtist=$('songArtist'), elNo=$('trackNo');
  var elFill=$('fill'), elBar=$('bar'), elNow=$('timeNow');
  var elTracks=$('tracks'), elPageInfo=$('pageInfo'), elSearch=$('search');
  var elMain=$('viewMain'), elList=$('viewList'), elStatusIcon=$('statusIcon');
  var elBtnPlaySide=$('btnPlaySide');
  var elPrevPage=$('btnPrevPage'), elNextPage=$('btnNextPage');
  var sonyMenu = $('sonyMenu'), valRepeat = $('valRepeat'), valShuffle = $('valShuffle'), valWidth = $('valWidth');
  var elStars = document.querySelectorAll('#starRating .star');
  var current = 0, page = 0, view = 'main', shuffle = false, repeat = 'all', query = '', PER_PAGE = 4;
  var currentRating = 5;
  /* ---------- 声道加宽（WIDE） ---------- */
  var actx = null, widenNode = null, wideIdx = 0;
  var WIDE_STEPS = [{k:1,label:'NORMAL',tag:'W:NORM'},{k:1.8,label:'WIDE',tag:'W:WIDE'},{k:2.6,label:'SUPER',tag:'W:SUPER'}];
  function ensureGraph(){
    /* 本地直接打开（file://）时浏览器不允许接音效通道，自动绕开保证出声；部署上网后自动启用 */
    if(location.protocol === 'file:'){ actx = null; widenNode = null; return; }
    if(actx){ if(actx.state === 'suspended') actx.resume(); return; }
    try{
      actx = new (window.AudioContext || window.webkitAudioContext)();
      var srcN = actx.createMediaElementSource(audio);
      var split = actx.createChannelSplitter(2);
      var merge = actx.createChannelMerger(2);
      var mid = actx.createGain(); mid.gain.value = 0.5;
      split.connect(mid, 0); split.connect(mid, 1);
      var sPos = actx.createGain(); sPos.gain.value = 0.5;
      var sNeg = actx.createGain(); sNeg.gain.value = -0.5;
      split.connect(sPos, 0); split.connect(sNeg, 1);
      var side = actx.createGain(); sPos.connect(side); sNeg.connect(side);
      widenNode = actx.createGain(); widenNode.gain.value = WIDE_STEPS[wideIdx].k;
      side.connect(widenNode);
      var inv = actx.createGain(); inv.gain.value = -1; widenNode.connect(inv);
      var oL1 = actx.createGain(), oL2 = actx.createGain();
      var oR1 = actx.createGain(), oR2 = actx.createGain();
      mid.connect(oL1); widenNode.connect(oL2);
      mid.connect(oR1); inv.connect(oR2);
      oL1.connect(merge, 0, 0); oL2.connect(merge, 0, 0);
      oR1.connect(merge, 0, 1); oR2.connect(merge, 0, 1);
      srcN.connect(split);
      merge.connect(actx.destination);
    }catch(e){ actx = null; widenNode = null; }
  }
  function cycleWidth(){
    wideIdx = (wideIdx + 1) % WIDE_STEPS.length;
    var st = WIDE_STEPS[wideIdx];
    if(widenNode) widenNode.gain.value = st.k;
    if(actx && actx.state === 'suspended') actx.resume();
    valWidth.textContent = st.label;
    $('wideTag').textContent = st.tag;
  }
  function updateStars(rating) {
    elStars.forEach(function(star, index){
      if(index < rating) star.classList.add('on');
      else star.classList.remove('on');
    });
  }
  elStars.forEach(function(star, index){
    star.addEventListener('click', function(){
      var targetRating = index + 1;
      if(currentRating === targetRating) currentRating = 0;
      else currentRating = targetRating;
      updateStars(currentRating);
      if(list.length) {
        var key = 'tapeclear_rating_' + list[current].file;
        try{ localStorage.setItem(key, currentRating); }catch(e){}
      }
    });
  });
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function fmt(t){ if (!isFinite(t) || t < 0) return '00:00'; return pad(Math.floor(t/60)) + ':' + pad(Math.floor(t%60)); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function visible(){
    if (!query) return list.map(function(t,i){ return {t:t, i:i}; });
    var q = query.toLowerCase();
    return list.map(function(t,i){ return {t:t, i:i}; }).filter(function(o){
      return (o.t.title||'').toLowerCase().indexOf(q) !== -1;
    });
  }
  function setPlayIcon(p){
    if(p) { elBtnPlaySide.textContent = '❚❚'; elBtnPlaySide.classList.add('paused'); elStatusIcon.textContent = '❚❚'; }
    else { elBtnPlaySide.textContent = '▶'; elBtnPlaySide.classList.remove('paused'); elStatusIcon.textContent = '▶'; }
  }
  function loadTrack(i, autoplay){
    if (!list.length) return;
    current = ((i % list.length) + list.length) % list.length;
    var t = list[current];
    audio.src = t.file;
    elTitle.textContent = t.title || '未命名曲目';
    elArtist.textContent = t.artist || 'TAPE CLEAR';
    $('songGenre').textContent = t.genre || 'AI MUSIC';
    $('songYear').textContent = t.year || '2026';
    elNo.textContent = (current+1) + '/' + list.length;
    var savedRating = null;
    try{ savedRating = localStorage.getItem('tapeclear_rating_' + t.file); }catch(e){}
    currentRating = savedRating !== null ? parseInt(savedRating) : 5;
    updateStars(currentRating);
    if (t.cover){
      elCover.onerror = function(){ elCover.style.display='none'; elCoverPh.style.display=''; };
      elCover.src = t.cover;
      elCover.style.display='';
      elCoverPh.style.display='none';
    } else {
      elCover.removeAttribute('src');
      elCover.style.display='none';
      elCoverPh.style.display='';
    }
    elFill.style.width = '0%';
    elNow.textContent = '00:00';
    if('mediaSession' in navigator){
      navigator.mediaSession.metadata=new MediaMetadata({
        title:t.title||'未命名曲目',
        artist:t.artist||'TAPE CLEAR',
        album:'TAPE CLEAR',
        artwork:t.cover?[{src:t.cover,sizes:'512x512',type:'image/jpeg'}]:[]
      });
    }
    if (autoplay) play();
    renderTracks();
  }
  function play(){
    ensureGraph();
    audio.play().then(function(){ setPlayIcon(true); }).catch(function(){ setPlayIcon(false); });
  }
  function pause(){ audio.pause(); setPlayIcon(false); }
  function toggle(){ if (audio.paused) play(); else pause(); }
  function goNext(auto){
    if (!list.length) return;
    if (shuffle){
      if (list.length === 1){ loadTrack(current, auto); return; }
      var n = current;
      while (n === current) n = Math.floor(Math.random()*list.length);
      loadTrack(n, auto);
    } else {
      if (current === list.length - 1 && repeat === 'off'){ pause(); return; }
      loadTrack(current + 1, auto);
    }
  }
  function goPrev(){
    if (!list.length) return;
    if (audio.currentTime > 3){ audio.currentTime = 0; return; }
    loadTrack(current - 1, true);
  }
  function renderTracks(){
    var vis = visible(), totalPages = Math.max(1, Math.ceil(vis.length / PER_PAGE));
    if (page > totalPages - 1) page = totalPages - 1;
    if (page < 0) page = 0;
    var start = page * PER_PAGE, slice = vis.slice(start, start + PER_PAGE);
    if (!slice.length){
      elTracks.innerHTML = '<div class="trow" style="opacity:.4;cursor:default">没有匹配的曲目</div>';
    } else {
      elTracks.innerHTML = slice.map(function(o){
        var t = o.t, cls = 'trow' + (o.i === current ? ' active' : '');
        return '<div class="' + cls + '" data-idx="' + o.i + '"><span class="n">' + pad(o.i+1) + '</span><span class="t">' + esc(t.title || '未命名') + '</span></div>';
      }).join('');
    }
    elPageInfo.textContent = (page+1) + ' / ' + totalPages;
    elPrevPage.disabled = page <= 0;
    elNextPage.disabled = page >= totalPages - 1;
  }
  function showView(v){
    view = v;
    elMain.classList.toggle('hidden', v !== 'main');
    elList.classList.toggle('hidden', v !== 'list');
    if (v === 'list') renderTracks();
  }
  function syncModes(){
    valRepeat.textContent = repeat === 'all' ? '全曲' : (repeat === 'one' ? '1曲' : '解除');
    valShuffle.textContent = shuffle ? '入' : '切';
    valWidth.textContent = WIDE_STEPS[wideIdx].label;
  }
  audio.addEventListener('play', function(){ setPlayIcon(true); });
  audio.addEventListener('pause', function(){ setPlayIcon(false); });
  /* 预加载下一首：当前歌缓冲稳了之后，后台提前下载下一首音频+封面 */
  var preCache = {};
  var preAudio = new Audio(); preAudio.preload = 'auto';
  function prefetchNext(){
  if (!list.length) return;
  var nt = list[(current + 1) % list.length];
  if (!nt || !nt.file || preCache[nt.file]) return;
  preCache[nt.file] = true;
  preAudio.src = nt.file; preAudio.load();
  if (nt.cover){ var im = new Image(); im.src = nt.cover; }
  }
  audio.addEventListener('canplaythrough', prefetchNext);
  audio.addEventListener('playing', function(){ setTimeout(prefetchNext, 8000); });
  audio.addEventListener('timeupdate', function(){
    elNow.textContent = fmt(audio.currentTime);
    if (isFinite(audio.duration) && audio.duration > 0) elFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
  });
  audio.addEventListener('ended', function(){
    if (repeat === 'one') { audio.currentTime = 0; play(); return; }
    if (repeat === 'off' && current === list.length - 1) { pause(); return; }
    goNext(true);
  });
  audio.addEventListener('error', function(){
    if (list[current]) elArtist.textContent = '⚠ 找不到：' + list[current].file;
  });
  function seek(e){
    if (!isFinite(audio.duration) || audio.duration <= 0) return;
    var r = elBar.getBoundingClientRect(), x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    var pct = Math.min(1, Math.max(0, x / r.width));
    audio.currentTime = pct * audio.duration;
    elFill.style.width = (pct*100) + '%';
  }
  var seeking = false;
  elBar.addEventListener('mousedown', function(e){ seeking = true; seek(e); });
  document.addEventListener('mousemove', function(e){ if (!seeking) return; if ((e.buttons & 1) === 0){ seeking = false; return; } seek(e); });
  window.addEventListener('blur', function(){ seeking = false; });
  document.addEventListener('mouseup', function(){ seeking = false; });
  elBar.addEventListener('touchstart', function(e){ seek(e); }, {passive:true});
  elBar.addEventListener('touchmove', function(e){ seek(e); }, {passive:true});
  elBtnPlaySide.addEventListener('click', toggle);
  $('btnPrev').addEventListener('click', goPrev);
  $('btnNext').addEventListener('click', function(){ goNext(true); });
  $('btnVolUp').addEventListener('click', function(){ audio.volume = Math.min(1, audio.volume + 0.1); $('volume').value = audio.volume; });
  $('btnVolDown').addEventListener('click', function(){ audio.volume = Math.max(0, audio.volume - 0.1); $('volume').value = audio.volume; });
  $('btnMenu').addEventListener('click', function(){ showView(view === 'list' ? 'main' : 'list'); });
  $('btnStop').addEventListener('click', function(){
    if (sonyMenu.classList.contains('show')) {
      sonyMenu.classList.remove('show');
    } else if (view === 'list') {
      showView('main');
    }
  });
  $('btnPwr').addEventListener('click', function(){ if (audio.paused) play(); else pause(); });
  $('btnOption').addEventListener('click', function(){ sonyMenu.classList.add('show'); });
  $('btnMenuClose').addEventListener('click', function(){ sonyMenu.classList.remove('show'); });
  $('menuRepeat').addEventListener('click', function(){ repeat = repeat === 'all' ? 'one' : (repeat === 'one' ? 'off' : 'all'); syncModes(); });
  $('menuShuffle').addEventListener('click', function(){ shuffle = !shuffle; syncModes(); });
  $('menuWidth').addEventListener('click', cycleWidth);
  elPrevPage.addEventListener('click', function(){ page--; renderTracks(); });
  elNextPage.addEventListener('click', function(){ page++; renderTracks(); });
  elTracks.addEventListener('click', function(e){
    var row = e.target.closest('[data-idx]');
    if (!row) return;
    loadTrack(+row.dataset.idx, true);
    showView('main');
  });
  elSearch.addEventListener('input', function(e){ query = e.target.value.trim(); page = 0; renderTracks(); });
  $('volume').addEventListener('input', function(e){ audio.volume = +e.target.value; });
  audio.volume = 0.8;
  syncModes();
  if (list.length) loadTrack(0, false);
  else renderTracks();
  showView('main');
  if('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play',function(){play();});
    navigator.mediaSession.setActionHandler('pause',function(){pause();});
    navigator.mediaSession.setActionHandler('previoustrack',function(){goPrev();});
    navigator.mediaSession.setActionHandler('nexttrack',function(){goNext(true);});
  }
})();
</script>
<script>document.body.style.visibility='visible';</script>
</body>
</html>
