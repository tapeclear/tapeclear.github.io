<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; font-family:"MS PGothic","SimHei",sans-serif; }
body { background:#000; }
#phone { height:100%; max-width:480px; margin:0 auto; display:flex; flex-direction:column; background:linear-gradient(160deg,#2a2a3a,#14141f); position:relative; border-left:1px solid #444; border-right:1px solid #444; }
#statusbar { height:34px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 12px; font-size:12px; color:#cfd2ff; background:linear-gradient(#3a3a55,#22222f); border-bottom:1px solid #555; letter-spacing:1px; }
#clock { font-weight:bold; }

/* ===== 待机时钟 ===== */
#standby { position:absolute; inset:34px 0 0 0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
  background: radial-gradient(circle at 30% 25%, rgba(160,120,255,.3), transparent 55%),

              linear-gradient(160deg,#1c1c2e,#101018); }
#standby .bigtime { font-size:56px; font-weight:bold; letter-spacing:3px; color:#f2f0ff; text-shadow:0 0 24px rgba(180,140,255,.9); }
#standby .date { font-size:15px; margin-top:14px; color:#c9c4f5; }
#standby .hint { font-size:13px; margin-top:40px; color:#9d8fd8; letter-spacing:3px; animation:blink 1.8s step-end infinite; }
@keyframes blink { 50% { opacity:0; } }

#desktop { flex:1; overflow-y:auto; padding:16px 12px;
  background: radial-gradient(circle at 30% 20%, rgba(160,120,255,.25), transparent 55%),

              linear-gradient(160deg,#1c1c2e,#101018); }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px 6px; }
.app { display:flex; flex-direction:column; align-items:center; cursor:pointer; user-select:none; }
.app:active .icon { transform:scale(.9); filter:brightness(1.35); }
.icon { width:100%; aspect-ratio:1/1; max-width:76px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:34px;

.icon::after { content:""; position:absolute; left:0; top:0; width:100%; height:45%; background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.05)); border-radius:16px 16px 60% 60%; }

.icon-holo-svg .holoscr { animation:holoGlow 2.6s ease-in-out infinite; }

<script>
var loadingTimer, appMounted = false;
function mountFrame(file) {
  var old = document.getElementById('frame');
  var f = document.createElement('iframe');
  f.id = 'frame';
  old.parentNode.replaceChild(f, old);
  if (file === 'about:blank') { f.src = 'about:blank'; return; }
  f.src = 'about:blank';
  f.addEventListener('load', function onl() {
    f.removeEventListener('load', onl);
    try { f.contentWindow.location.replace(encodeURI(file)); }
    catch(e) { f.src = encodeURI(file); }
  });
}
function setBackLift(file) {
  document.getElementById('backbtn').classList.toggle('lift', file === 'holo.html');
}
function openApp(fileName, name) {
  clearTimeout(loadingTimer);
  document.getElementById('loadtext').textContent = 'LOADING ' + name + '…';
  document.getElementById('loading').style.display = 'flex';
  setBackLift(fileName);
  appMounted = true;
  loadingTimer = setTimeout(function () {
    mountFrame(fileName);
    try {
      if (history.state && history.state.app) history.replaceState({app: fileName}, '');
      else history.pushState({app: fileName}, '');
    } catch(e) {}
    document.getElementById('view').style.display = 'block';
    document.getElementById('backbtn').style.display = 'block';
    document.getElementById('loading').style.display = 'none';
  }, 1200);
}
function closeAppUI() {
  clearTimeout(loadingTimer);
  document.getElementById('view').style.display = 'none';
  document.getElementById('backbtn').style.display = 'none';
  setBackLift('');
  document.getElementById('loading').style.display = 'none';
  mountFrame('about:blank');
  appMounted = false;
}
function closeApp() {
  closeAppUI();
  if (history.state && history.state.app) { try { history.back(); } catch(e) {} }
}
window.addEventListener('popstate', function (e) {
  if (e.state && e.state.app) {
    if (!appMounted) {
      mountFrame(e.state.app);
      setBackLift(e.state.app);
      appMounted = true;
      document.getElementById('view').style.display = 'block';
      document.getElementById('backbtn').style.display = 'block';
    }
  } else if (appMounted) {
    closeAppUI();
  }
});
function fakeApp() {
  var t = document.getElementById('toast');
  t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 1500);
}
function unlock() { document.getElementById('standby').style.display = 'none'; }
function tick() {
  var d = new Date();
  var h = ('0'+d.getHours()).slice(-2);
  var m = ('0'+d.getMinutes()).slice(-2);
  document.getElementById('clock').textContent = h + ':' + m;
  document.getElementById('bigtime').textContent = h + ':' + m;
  var wk = ['日','一','二','三','四','五','六'];
  document.getElementById('date').textContent = (d.getMonth()+1) + '月' + d.getDate() + '日 星期' + wk[d.getDay()];
}
tick();
setInterval(tick, 10000);
</script>

<script>
/* ═══════════ 密码锁屏逻辑（新增，原有脚本未动） ═══════════
   【怎么改密码】只改下面 LOCK_HASH 引号里的一串即可：
   1. 打开你的网站，按 F12 打开控制台，切到 Console（控制台）标签
   2. 输入：  lockFingerprint("你的新密码")   然后回车
   3. 会打印出一串字符（比如 7R96Q0 这样），复制它，
      替换下面 LOCK_HASH = ' ' 引号里的内容，保存重新上传即可
   ※ 密码里的空格会被自动忽略：输不输空格、输几个空格都能解锁
   ※ 源码里只有这串“指纹”，看不到密码原文。 */
(function () {
  var LOCK_HASH = '7R96Q0';
  var lock  = document.getElementById('lock');
  var input = document.getElementById('lockpass');
  var msg   = document.getElementById('lockmsg');
  var btn   = document.getElementById('lockbtn');
  var tries = 0;

  window.lockFingerprint = function (s) {
    s = String(s).normalize('NFKC').replace(/\s+/g, '').toUpperCase();
    s = 'Y2K-TAPE-2000::' + s;
    var h = 5381;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) + h) ^ s.charCodeAt(i); }
    return (h >>> 0).toString(36).toUpperCase();
  };

  function tryUnlock() {
    if (lockFingerprint(input.value) === LOCK_HASH) {
      msg.textContent = '✓ WELCOME BACK TO 2000';
      msg.style.color = '#b6f2c5';
      lock.classList.add('off');
      setTimeout(function () { lock.style.display = 'none'; }, 480);
    } else {
      tries++;
      msg.style.color = '#ff9ecb';
      msg.textContent = (tries >= 3) ? '✗ 还是不对…提示：和 Y2K 那年的回忆有关' : '✗ 密码不对，再想想';
      lock.classList.remove('shake');
      void lock.offsetWidth;
      lock.classList.add('shake');
      input.value = '';
      input.focus();
    }
  }
  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });

  /* 显示/隐藏密码按钮：常驻可用，不依赖浏览器自带的小眼睛 */
  var eye = document.getElementById('lockeye');
  eye.addEventListener('click', function () {
    var toText = (input.type === 'password');
    input.type = toText ? 'text' : 'password';
    eye.textContent = toText ? '隐藏' : '显示';
    try { input.focus(); } catch (e) {}
  });

  /* 锁屏上的时钟：独立小逻辑，不动原有 tick */
  function lockTick() {
    var d = new Date();
    var h = ('0' + d.getHours()).slice(-2), m = ('0' + d.getMinutes()).slice(-2);
    var lt = document.getElementById('locktime'), ld = document.getElementById('lockdate');
    if (lt) lt.textContent = h + ':' + m;
    if (ld) {
      var wk = ['日','一','二','三','四','五','六'];
      ld.textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 星期' + wk[d.getDay()];
    }
  }
  lockTick();
  setInterval(lockTick, 10000);
  setTimeout(function () { try { input.focus(); } catch (e) {} }, 300);
})();
</script>
</body>
</html>
